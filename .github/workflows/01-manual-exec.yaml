# CI de Nível 01 - Disparo manual através de clique

# nome do pipeline
name: "Execução Manual"

# gatilhos / triggers - regras de disparo
# gatilho manual = workflow_dispatch

on:
    workflow_dispatch:

# tarefas dentro da pipeline = jobs

jobs:
    #nome do job
    e2e-tests:
        # máquina onde o job vai rodar
        runs-on: ubuntu-latest

        # passos do job
        steps:
            # clone do projeto
            - uses: actions/checkout@v4

            # instalação do node
            - uses: actions/setup-node@v4
              with:
                  node-version: 24.x

            # Instalação do Yarn
            - name: Instalando Yarn
              run: npm install -g yarn

            # Instalação das dependências
            - name: Instalando dependências
              run: yarn

            # Instalação dos Browsers do Playwright
            - name: Instalando Browsers do Playwright
              run: yarn playwright install

            # Executar os testes e2e
            - name: Executando testes e2e
              run: yarn run e2e

            # Notificação do Discord (Exercício 02)
            - name: Notificar no Discord
              uses: Ilshidur/action-discord@master
              if: always() # Garante o aviso mesmo se o 'yarn run e2e' quebrar
              env:
                DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
              with:
                args: 'O pipeline do projeto pgats-ci terminou de rodar! Verifique o status no GitHub Actions.'
            
